%YAML 1.2
---
$id: http://devicetree.org/schemas/display/sitronix,st7565p.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sitronix ST7565P Display Controller

maintainers:
  - Technologic Systems

description:
  Sitronix ST7565P is a monochrome dot matrix LCD controller.

allOf:
  - $ref: panel/panel-common.yaml#

properties:
  compatible:
    const: sitronix,st7565p
  reg:
    maxItems: 1
  sitronix,inverted:
    type: boolean
  reset-gpios: true
  dc-gpios: true
  width-mm: true
  height-mm: true
  panel-timing: true

required:
  - compatible
  - reg
  - width-mm
  - height-mm
  - panel-timing

additionalProperties: false
