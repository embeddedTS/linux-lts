%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/technologic,ts-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: embeddedTS supervisory microcontroller watchdog

maintainers:
  - Mark Featherston <mark@embeddedts.com>

description: |
  The watchdog is a child of an embeddedTS supervisory microcontroller and
  communicates over the parent's I2C connection.

properties:
  compatible:
    const: technologic,ts-wdt

  enable-early:
    type: boolean
    description: Assume the watchdog was started by the bootloader.

  timeout-sec:
    $ref: /schemas/types.yaml#/definitions/uint32

  status: true

  technologic,skip-micro-handler:
    type: boolean
    description: Do not use the watchdog as a system restart handler.

required:
  - compatible

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        supervisor@54 {
            compatible = "technologic,ts-supervisor-gen1";
            reg = <0x54>;
            watchdog {
                compatible = "technologic,ts-wdt";
            };
        };
    };
...
