%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/technologic,ts7553v2-supervisor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: embeddedTS TS-7553-V2 supervisory microcontroller

maintainers:
  - Mark Featherston <mark@embeddedts.com>

description: |
  This controller sends a fixed ADC snapshot on each I2C read. Single-byte
  writes control the supercapacitor charger. Power-fail is a separate GPIO.

properties:
  compatible:
    const: technologic,ts7553v2-supervisor
  reg:
    maxItems: 1
  adc:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: technologic,ts7553v2-supervisor-adc
      '#io-channel-cells':
        const: 1
    required:
      - compatible
      - '#io-channel-cells'
  watchdog:
    $ref: /schemas/watchdog/technologic,ts-wdt.yaml#

  supercaps:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: technologic,ts7553v2-silo
      power-fail-gpios:
        maxItems: 1
    required:
      - compatible
      - power-fail-gpios

required:
  - compatible
  - reg
  - adc
  - supercaps
additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        microcontroller@2a {
            compatible = "technologic,ts7553v2-supervisor";
            reg = <0x2a>;
            adc {
                compatible = "technologic,ts7553v2-supervisor-adc";
                #io-channel-cells = <1>;
            };
            supercaps {
                compatible = "technologic,ts7553v2-silo";
                power-fail-gpios = <&gpio5 0 GPIO_ACTIVE_HIGH>;
            };
        };
    };
