%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/technologic,ts7100-supervisor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: embeddedTS TS-7100 supervisory microcontroller

maintainers:
  - Mark Featherston <mark@embeddedts.com>

description: |
  The microcontroller provides ADC readings and supercapacitor charging
  controls. The TS-7180 firmware exposes channels 0 through 3 as raw ADC
  readings; the TS-7100 firmware returns these channels in millivolts.

properties:
  compatible:
    const: technologic,ts7100-supervisor

  reg:
    maxItems: 1

  adc:
    type: object
    additionalProperties: false
    properties:
      compatible:
        enum:
          - technologic,ts7100-supervisor-adc
          - technologic,ts7180-supervisor-adc
      '#io-channel-cells':
        const: 1
    required:
      - compatible
      - '#io-channel-cells'

  watchdog:
    $ref: /schemas/watchdog/technologic,ts-wdt.yaml#

  supercaps:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: technologic,ts7100-silo
    required:
      - compatible

required:
  - compatible
  - reg
  - adc
  - supercaps

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        microcontroller@54 {
            compatible = "technologic,ts7100-supervisor";
            reg = <0x54>;
            adc {
                compatible = "technologic,ts7100-supervisor-adc";
                #io-channel-cells = <1>;
            };
            supercaps {
                compatible = "technologic,ts7100-silo";
            };
        };
    };
