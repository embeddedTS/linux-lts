%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/technologic,ts4100-supervisor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: embeddedTS TS-4100 supervisory microcontroller

maintainers:
  - Mark Featherston <mark@embeddedts.com>

description: |
  This controller sends a fixed ADC snapshot on each I2C read. Single-byte
  writes control the supercapacitor charger and push-switch reset enable.
  Power-fail is a separate GPIO.

properties:
  compatible:
    const: technologic,ts4100-supervisor
  reg:
    maxItems: 1
  reset:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: technologic,ts4100-supervisor-reset
      ts,skip-micro-handler:
        type: boolean
        description: Do not use the supervisor as a system restart handler.
    required:
      - compatible

  watchdog:
    $ref: /schemas/watchdog/technologic,ts-wdt.yaml#

  supercaps:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: technologic,ts4100-silo
      power-fail-gpios:
        maxItems: 1
    required:
      - compatible
      - power-fail-gpios

required:
  - compatible
  - reg
  - supercaps
additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        microcontroller@4a {
            compatible = "technologic,ts4100-supervisor";
            reg = <0x4a>;
            supercaps {
                compatible = "technologic,ts4100-silo";
                power-fail-gpios = <&gpio5 0 GPIO_ACTIVE_HIGH>;
            };
        };
    };
